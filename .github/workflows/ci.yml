name: CI

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # NuGet Trusted Publishing (OIDC)
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore FastPdfWriterStream.sln

      - name: Build
        run: dotnet build FastPdfWriterStream.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/FastPdfWriterStream.Tests/FastPdfWriterStream.Tests.csproj -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/FastPdfWriterStream/FastPdfWriterStream.csproj -c Release --no-build -o ./nupkg
          dotnet pack src/FastPdfWriterStream.Designer/FastPdfWriterStream.Designer.csproj -c Release --no-build -o ./nupkg

      - name: NuGet login (Trusted Publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        id: login
        with:
          user: Ghreza74

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
